# Projet Xcode généré par XcodeGen : `brew install xcodegen && xcodegen generate`
name: ScootRoute
options:
  bundleIdPrefix: fr.scootroute
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ScootRoute:
    type: application
    platform: iOS
    sources:
      - path: ScootRoute
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: ScootRoute/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  ScootRouteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScootRouteTests
    dependencies:
      - target: ScootRoute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScootRoute.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScootRoute"

schemes:
  ScootRoute:
    build:
      targets:
        ScootRoute: all
        ScootRouteTests: [test]
    test:
      targets:
        - ScootRouteTests
